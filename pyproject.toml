[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytemap"
version = "0.3.0"
description = "Find big, old and duplicate files and see what fills your disk. Runs fully offline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "makaDv" }]
dependencies = ["Send2Trash>=1.8"]
keywords = ["disk", "cleanup", "duplicates", "treemap", "disk-usage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bytemap = "bytemap.cli:main"

[project.urls]
Homepage = "https://github.com/makaDv/ByteMap"

[tool.setuptools]
packages = ["bytemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
